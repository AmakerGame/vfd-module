name: Build AArch64 Kernel Module
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Multiarch and Install ARM64 Headers
        run: |
          # Додаємо архітектуру arm64 до apt для отримання нативних ARM64 заголовків
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential linux-headers-arm64

      - name: Compile 64-bit Module
        run: |
          # Знаходимо шлях саме до ARM64 заголовків
          KDIR=$(ls -d /usr/src/linux-headers-*-arm64 | head -n 1)
          echo "Using ARM64 KDIR: $KDIR"
          
          # Запускаємо збірку з чистими ARM64 заголовками
          make -C $KDIR M=$PWD ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules

      - name: Verify Architecture
        run: |
          file vfd_fix.ko
          ls -la vfd_fix.ko

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfd_fix_aarch64
          path: "vfd_fix.ko"
