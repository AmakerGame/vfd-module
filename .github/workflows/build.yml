name: Build VFD Display Module

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel-version:
          - 5.4
          - 5.10
          - 5.15
          - 6.0
          - 6.1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          linux-headers-generic \
          kmod \
          gcc \
          make

    - name: Check kernel headers
      run: |
        echo "Kernel version: $(uname -r)"
        ls -la /lib/modules/$(uname -r)/build/ || echo "Kernel headers not found"

    - name: Build VFD module
      working-directory: ./
      run: |
        echo "Building VFD Display Module..."
        make clean
        make
        echo "Build completed!"
        ls -lh *.ko 2>/dev/null || echo "No .ko files generated"

    - name: Verify module
      run: |
        if [ -f vfd_display.ko ]; then
          echo "✓ Module compiled successfully"
          file vfd_display.ko
          nm vfd_display.ko | grep -E "set_vfd_led_value|MDrv_" || echo "Warning: Expected symbols not found"
        else
          echo "✗ Module compilation failed"
          exit 1
        fi

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vfd_display_module_${{ matrix.kernel-version }}
        path: vfd_display.ko
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: vfd_display.ko
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  documentation:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate documentation
      run: |
        echo "# VFD Display Module Build Report" > BUILD_REPORT.md
        echo "" >> BUILD_REPORT.md
        echo "Build timestamp: $(date)" >> BUILD_REPORT.md
        echo "Kernel: $(uname -r)" >> BUILD_REPORT.md
        echo "" >> BUILD_REPORT.md
        echo "## Build Status: ✓ SUCCESS" >> BUILD_REPORT.md

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: build_documentation
        path: BUILD_REPORT.md

  test:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    steps:
    - name: Download module
      uses: actions/download-artifact@v4
      with:
        name: vfd_display_module_5.4

    - name: Check module file
      run: |
        if [ -f vfd_display.ko ]; then
          echo "✓ Module artifact downloaded"
          file vfd_display.ko
          ls -lh vfd_display.ko
        else
          echo "✗ Module not found"
          exit 1
        fi
