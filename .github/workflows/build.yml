name: Build Kernel Module
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain and ARM64 Kernel Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential linux-headers-generic-hwe-24.04 || sudo apt-get install -y gcc-aarch64-linux-gnu build-essential linux-headers-$(uname -r)

      - name: Compile Module
        run: |
          echo "obj-m += vfd_fix.o" > Makefile
          KDIR=$(ls -d /lib/modules/*/build | head -n 1)
          echo "Building with KDIR=$KHDR"
          make -C $KDIR M=$PWD ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules

      - name: Verify Output File
        run: |
          ls -la
          test -f vfd_fix.ko || (echo "ERROR: vfd_fix.ko was not generated!" && exit 1)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfd_fix_module
          path: "vfd_fix.ko"
