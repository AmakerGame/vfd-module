name: Build AArch64 Kernel Module (5.4.125)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential libncurses-dev bison flex libssl-dev bc wget xz-utils

      - name: Download and Prepare Exact Kernel 5.4.125 Sources
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.4.125.tar.xz
          tar -xf linux-5.4.125.tar.xz
          cd linux-5.4.125
          
          # Створюємо базову конфігурацію під ARM64
          make ARCH=arm64 defconfig
          
          # Явно розділяємо хост-компілятор (HOSTCC) та цільовий крос-компілятор (CC)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc CC=aarch64-linux-gnu-gcc prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc CC=aarch64-linux-gnu-gcc scripts

      - name: Compile Kernel Module
        run: |
          # Зберігаємо шлях до кореня репозиторію
          ROOT_DIR=$PWD
          cd linux-5.4.125
          
          # Компілюємо модуль з папки ядра, вказуючи шлях до наших вихідних кодів через M=
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc M=$ROOT_DIR modules

      - name: Verify File Format
        run: |
          file vfd_display.ko
          aarch64-linux-gnu-readelf -h vfd_display.ko

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfd_display_kernel_5.4.125
          path: vfd_display.ko
