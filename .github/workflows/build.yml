name: Build Kernel Module
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential

      - name: Compile Autonomous Module
        run: |
          # Компілюємо напряму під ARM64 безпосередньо в об'єктний файл
          aarch64-linux-gnu-gcc -O2 -Wall -Wno-error -ffreestanding -fno-builtin \
            -c vfd_fix.c -o vfd_fix.ko

      - name: Verify File
        run: |
          ls -la vfd_fix.ko
          file vfd_fix.ko

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfd_fix_module
          path: "vfd_fix.ko"
