name: Build AArch64 Kernel Module
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain and Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential linux-headers-generic

      - name: Compile 64-bit Module
        run: |
          KDIR=$(ls -d /lib/modules/*/build | head -n 1)
          
          # Компілюємо під ARM64 з явним зазначенням крос-компілятора
          make -C $KDIR M=$PWD ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc modules

      - name: Verify Architecture
        run: |
          file vfd_fix.ko
          ls -la vfd_fix.ko

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfd_fix_aarch64
          path: "vfd_fix.ko"
