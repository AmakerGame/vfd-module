name: Build Kernel Module
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 Cross Compiler and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential linux-headers-generic

      - name: Compile Module
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- || true

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfd_fix_module
          path: "*.ko"
